name: Bug report
description: Something does not work as expected
labels: ["type: fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Co się stało, i czego oczekiwano?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser, OS, version or commit
